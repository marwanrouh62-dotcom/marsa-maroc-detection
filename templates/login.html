<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Marsa Maroc</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo_compact.png') }}">
</head>
<body>
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg, var(--navy-900), var(--navy-800));">
    <div class="card form-card" style="width:340px;">
      <div style="text-align:center; margin-bottom:1.5rem;">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Marsa Maroc" style="height:70px; width:auto;">
        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:0.5rem;">Détection remplissage camions</div>
      </div>

      {% if erreur %}
      <div class="alert alert-error">{{ erreur }}</div>
      {% endif %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="field">
          <label for="identifiant">Identifiant</label>
          <input type="text" id="identifiant" name="identifiant" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="mot_de_passe">Mot de passe</label>
          <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password" required>
        </div>
        <div class="field">
          <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Se connecter</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
