<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Détection remplissage camions{% endblock %} — Marsa Maroc</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo_compact.png') }}">
</head>
<body>
  <nav class="navbar">
    <a class="brand" href="/">
      <img class="brand-logo" src="{{ url_for('static', filename='img/logo_compact.png') }}" alt="Marsa Maroc">
      <span class="brand-sub">Détection remplissage camions</span>
    </a>
    <div class="navlinks">
      <a href="/" class="{{ 'active' if active == 'accueil' }}">Accueil</a>
      <a href="/analyser" class="{{ 'active' if active == 'analyser' }}">Analyser une photo</a>
      <a href="/historique" class="{{ 'active' if active == 'historique' }}">Historique</a>
      <a href="/portails" class="{{ 'active' if active == 'portails' }}">Portails</a>
      <a href="/parametres" class="{{ 'active' if active == 'parametres' }}">Paramètres</a>
      {% if session.utilisateur %}
      <a href="/compte" class="{{ 'active' if active == 'compte' }}" style="margin-left:0.75rem; border-left:1px solid var(--border); padding-left:1rem;">{{ session.utilisateur }}</a>
      <a href="/logout">Déconnexion</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
